# shep cable for Television — https://github.com/alexpasmantier/television
#
# Copy this file into the cable directory your Television build reads
# (commonly ~/.config/television/cable/shep.toml) and launch it with
# `tv shep`. The cable uses `shep list --format tsv` as its source, so every
# candidate from Herdr workspaces, predefined [[workspaces]], zoxide, and
# discovered projects appears in the picker. Selecting an entry opens it
# through `shep open --path`, which focuses an existing Herdr workspace for
# that path (or creates one and applies its template) and falls back to
# printing the normalised path when Herdr is unavailable.

[metadata]
name = "shep"
description = "Browse shep project candidates and open them with Herdr"
requirements = ["shep", "herdr"]

# `shep list --format tsv` prints one "path<TAB>label<TAB>icon" line per
# candidate (3 columns). Television's {split:\t:N} extracts fields by index:
#   {split:\t:0} -> path   (what open/preview act on, and the default output)
#   {split:\t:1} -> label  (the project's human name)
#   {split:\t:2} -> icon   (the source's configured icon, e.g. a Nerd Font glyph)
# In TOML basic strings "\t" decodes to a real TAB byte, matching the TSV's
# tab separator — the same convention the command fields below already rely on.
#
# display renders each results-list entry as "<icon> <label>" instead of the
# raw TSV line, so the picker shows a clean, icon-prefixed name. output
# forwards just the path when an entry is selected by any default/non-custom
# action, matching what [actions.open] extracts manually.
[source]
command = "shep list --format tsv"
display = "{split:\t:2} {split:\t:1}"
output = "{split:\t:0}"

# `shep preview --color '{split:\t:0}'` renders the same label/path/source/git
# (or a declared [preview.commands.<name>]) preview shown in the `shep open`
# picker's preview pane, so the Television preview panel always matches.
# --color is FORCED (like `lsd/eza/bat --color=always`): it passes the
# renderer's real ANSI color through verbatim even though Television runs this
# as a subprocess whose stdout is a pipe, never a terminal. That is what lets
# the preview panel show real color for "dir" (lsd/eza) and "active_pane"
# (captured pane) sections — Television's own preview panel renders the ANSI,
# not the child process's terminal. (The default, no --color, stays plain.)
[preview]
command = "shep preview --color '{split:\t:0}'"

# Open the selected project: focus-or-create a Herdr workspace for its path,
# or print the resolved absolute path when Herdr is absent (HI-5/HI-6). `mode =
# "execute"` lets the opened workspace replace the picker process.
[actions.open]
description = "Open the selected project with Herdr (or print its path)"
command = "shep open --path '{split:\t:0}'"
mode = "execute"

[keybindings]
enter = "actions:open"

# landscape matches shep's own default side-by-side feel; a 50% preview panel
# gives the now-colored preview (dir/active_pane) a little more room than
# Television's own default. Kept intentionally minimal.
[ui]
layout = "landscape"

[ui.preview_panel]
size = 50

# Additional projects can be mixed in at the shep level via a type = "group"
# [[workspaces]] entry (with sources = ["projects", ...]) in shep's own
# config.toml; the cable itself stays path-agnostic and safe to share across
# machines.
