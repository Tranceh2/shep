# shep example configuration (schema version 3)
#
# This is a practical, path-agnostic starting point. It is NOT what
# `shep init` writes (see internal/config/example.go / ExampleTOML() for the
# exhaustively-commented canonical reference, which lists every built-in
# default); this file favors a shorter, working example over line-by-line
# documentation of every field. The README's "Customization" section explains
# the templates, row parts, themes and precedence used below.
#
# Copy it to $XDG_CONFIG_HOME/shep/config.toml (or ~/.config/shep/config.toml
# when XDG_CONFIG_HOME is unset) and replace the example paths below with
# your own.

version = 3

[general]
# Built-ins, in merge/display order. "sessions" is opt-in: add it here only
# if you also want Herdr session rows (not just workspaces) in the picker.
source_order = ["herdr", "workspaces", "zoxide", "projects"]
# source_order = ["herdr", "sessions", "workspaces", "zoxide", "projects"]
selector = "builtin"

[ranking]
# Local adaptive ranking: learns from successful opens using a private
# SQLite WAL store that never records labels, queries, or network state.
# While enabled, the picker also keeps your last 50 searches that ended in a
# selection for ctrl+y; false turns both off.
enabled = true

[defaults]
template = "default"

# Responsive TUI: side-by-side on wide terminals, list-only on narrow ones.
# 35/65 is the shipped default split; layout is left unset so the picker
# decides automatically (do NOT set layout = "landscape" if you want that).
[tui]
# Ordered top tabs. Default: ["all", "agents"]. A source tab does not enable
# that source in "all"; custom sources and groups need matching declarations.
tabs = ["all", "agents"]
# tabs = ["all", "projects", "pull-requests", "project-group", "agents"]
list_width = "35%"
preview_width = "65%"
# "inherit" (the default) follows Herdr's own theme, [theme.custom] included.
# Name a built-in theme ("nord", "catppuccin-latte"...) or a [themes.<name>]
# table to pick one here.
theme = "inherit"
icons = "unicode"
# ctrl+x closes an open Herdr pane, tab, or workspace; opt into a footer y/n
# confirmation per kind. Omitted or [] means close immediately.
# confirm_close = ["workspace", "tab"]

# A custom theme: Herdr's nord palette with a pink accent and brighter row
# context. Select it with [tui].theme = "nord-pink".
[themes.nord-pink]
base = "nord"
accent = "#f5c2e7"
[themes.nord-pink.roles]
"row.detail" = "subtext0"

# [preview] intentionally has no "default" key here. Each source below
# declares its own preview list, which is exactly what shep ships without
# any [preview] section at all — spelled out so it is easy to tweak one
# source without silently affecting the others. timeout/cache_ttl/max_lines
# are the shipped defaults; adjust them only if previews feel slow or noisy.
[preview]
timeout = "150ms"
cache_ttl = "5s"
max_lines = 50

# A reusable preview section, listed by name in a preview = [...] list (the
# kubernetes wildcard below uses it). title is its heading in the picker;
# without it the heading would be the humanized name, "Recent commits".
[preview.commands.recent_commits]
command = "git -C {{.Path}} log -n 5 --oneline"
title = "Recent commits"

# Each source draws its rows from icon, label_format, detail_format and
# marker_format templates (see the README for the defaults). Only what
# differs from the defaults needs to be written.
[sources.herdr]
preview = ["workspace", "active_pane", "agent_status"]

# Agent titles come from Herdr; Herdr may already shorten terminal_title.
# Templates can use .Agent, .AgentStatus, .TabLabel, .Workspace (the Herdr
# workspace label) and every metadata key (.Meta.pane_id, .Meta.terminal_title,
# .Meta.kind...). This marker shows the agent's name before its workspace; a
# label_format of your own should keep {{ status }} to keep the status glyph.
[sources.agents]
marker_format = '{{ .Agent }} {{ .Workspace | trimIcon | name }}'
# preview = ["identity", "git"] # unset uses [preview].default; [] shows only identity

[sources.workspaces]
preview = ["identity", "dir"]

[sources.zoxide]
preview = ["identity", "dir"]

[sources.projects]
recursive = true
max_depth = 3
markers = [".git", "go.mod", "package.json", "Cargo.toml", "pyproject.toml", "flake.nix"]
ignore = ["node_modules", "vendor", ".direnv", ".devenv", "target", "dist", ".cache"]
preview = ["identity", "git", "dir"]

# --- Workspaces: a single project, a command workspace, and a group ---

[[workspaces]]
name = "dotfiles"
path = "~/dotfiles"
aliases = ["config"]

# An entry's icon and marker apply to its own row only.
[[workspaces]]
name = "notes"
path = "~/notes"
command = "nvim ."
close_on_exit = true
icon = " "
marker_format = '{{ pin }}'

[[workspaces]]
name = "projects"
id = "project-group" # stable tab reference; required only when used in [tui].tabs
type = "group"
path = "~/projects"
source_order = ["projects", "zoxide"]

  [workspaces.sources.projects]
  max_depth = 5

# --- Templates: a plain command and a two-tab development layout ---

[templates.default]
command = ""

[templates.k8s]
command = "k9s"

[templates.dev]
description = "development workspace"
focus = { tab = "AI", node = "opencode" }

[[templates.dev.tabs]]
name = "code"
root = "main"

  [[templates.dev.tabs.nodes]]
  id = "main"
  split = "rows"
  children = ["editor", "terminal"]
  sizes = [80, 20]

  [[templates.dev.tabs.nodes]]
  id = "editor"
  command = "nvim ."

  [[templates.dev.tabs.nodes]]
  id = "terminal"
  command = ""

[[templates.dev.tabs]]
name = "AI"
root = "opencode"

  [[templates.dev.tabs.nodes]]
  id = "opencode"
  command = "opencode"
  close_on_exit = true

# To activate the custom tabs shown in [tui].tabs above, declare a
# command-backed custom source that emits Shep candidates and a group with id = "project-group".
# [[sources.custom]]
# name = "pull-requests"
# command = ["/path/to/list-prs-for-shep"] # emits Shep JSON rows

# --- Wildcards: settings for every row under a path ---

# Every row under ~/projects/kubernetes (zoxide folders, projects, open Herdr
# workspaces...) gets the k8s template, a preview with recent commits and its
# own icon. Each setting comes from the first matching rule that sets it.
[[wildcards]]
pattern = "~/projects/kubernetes/**"
template = "k8s"
preview = ["identity", "git", "recent_commits"]
icon = "󱃾 "
icon_color = "blue"
