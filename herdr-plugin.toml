id = "tranceh2.shep"
name = "shep"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open the shep project picker as a Herdr floating overlay."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "-c", "command -v shep >/dev/null 2>&1 || { echo 'shep: install shep and ensure it is on PATH before installing/linking the Herdr plugin' >&2; exit 1; }"]

[[actions]]
id = "open-overlay"
title = "shep: Open project picker"
command = ["bash", "scripts/herdr-plugin-open-overlay.sh"]

[[panes]]
id = "shep-overlay"
title = "shep"
placement = "overlay"
command = ["shep", "open"]
