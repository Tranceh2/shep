# Herdr native popup keybind for launching shep.
# Copy this [[keys.command]] block into ~/.config/herdr/config.toml. Merge it
# into an existing [keys] table or [[keys.command]] list; do not duplicate
# [keys].
[[keys.command]]
key = "prefix+alt+p" # Pick any key your config does not already bind.
type = "popup"
command = "shep open"

# The keybind is global. When shep runs in this popup, it detects the current
# Herdr pane and enables its in-overlay features. Running `shep open` from a
# terminal remains supported.
