# Herdr keybinding configuration examples for Shep.
# Copy these [[keys.command]] blocks into ~/.config/herdr/config.toml.
# Merge them into your existing [keys] table or [[keys.command]] list;
# do not duplicate [keys].

# --- Option A: Unified Plugin Action (Recommended if using tranceh2.shep plugin) ---
# Launches the Shep picker popup using the declared plugin action. This
# requires ONLY the Herdr plugin to be installed — `shep link` is NOT
# needed for type = "plugin_action" keybindings.
[[keys.command]]
key = "prefix+ctrl+f" # Pick any key your config does not already bind.
type = "plugin_action"
command = "tranceh2.shep.open"
description = "open Shep picker"

# --- Option B: Native Popup Keybind (Requires shep on PATH, published via the
# separate, optional `shep link` verb) ---
# Launches shep open directly in a native Herdr popup modal.
# [[keys.command]]
# key = "prefix+ctrl+f"
# type = "popup"
# command = "shep open"

# --- Option C: Open a [[commands]] entry directly, without the picker
# (Requires shep on PATH via `shep link`, and a [[commands]] entry named
# lazygit in shep's config.toml) ---
# Herdr runs a type = "shell" command detached, in the background: this one
# opens lazygit as a split pane beside the focused pane.
# [[keys.command]]
# key = "prefix+g" # Pick any key your config does not already bind.
# type = "shell"
# command = "shep open lazygit --target pane"
# description = "lazygit beside this pane"

# --- Workspace Jump-Back (A<->B Previous Workspace Toggle) ---
# Toggles between the two most recently focused workspaces.
[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "tranceh2.shep.jump-back"
description = "jump to previous workspace"
