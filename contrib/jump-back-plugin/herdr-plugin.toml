# Herdr plugin that runs the shep workspace focus-history collector.
#
# This plugin is deliberately minimal. It declares exactly one startup hook and
# exactly one explicit start/recover action, and NOTHING else:
#
#   * No [[events]] hooks. A focus/close event hook would spawn one process per
#     focus change, which is precisely what the long-lived collector exists to
#     avoid.
#   * No [[panes]]. This plugin does not open the shep picker; it is unrelated
#     to the separate tranceh2.shep overlay registration, which it must not
#     disturb (note the distinct plugin id below).
#   * No [[build]]. Herdr's build step would run an unreviewed toolchain at
#     install time. The operator instead builds shep, verifies it, and copies
#     that executable to ./bin/shep before linking. See docs/jump-back.md.
#
# Both commands are the plugin-local relative path ./bin/shep, never a bare
# "shep". A bare name would resolve through the Herdr server's PATH and could
# launch an unverified binary.
#
# Installation, recovery, disable and uninstall are documented in
# docs/jump-back.md in this repository. bin/shep is an installation artifact
# and is never committed.

id = "tranceh2.shep-jump-back"
name = "shep jump-back history"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Track per-socket workspace focus history so `shep jump-back` can return to the previous workspace."
platforms = ["linux", "macos"]

# Runs once per enabled plugin after Herdr restores the session and its API
# socket is ready, with HERDR_PLUGIN_EVENT=startup. The collector reads
# HERDR_SOCKET_PATH from the injected plugin environment, so it always binds to
# the session that started it. A duplicate start against a live owner refuses
# and exits without disturbing the incumbent.
[[startup]]
command = ["./bin/shep", "watch-history"]

# The explicit start/recover action. It runs the SAME argv as the startup hook,
# so operator recovery and autostart are one code path with one behaviour:
# start if no owner holds this socket, otherwise refuse harmlessly. Recovery
# succeeds only against a dead/exited owner. A live but hung owner is refused;
# this plugin never kills, signals, or guesses a process id.
[[actions]]
id = "start"
title = "Start jump-back history collector"
contexts = ["workspace"]
command = ["./bin/shep", "watch-history"]
